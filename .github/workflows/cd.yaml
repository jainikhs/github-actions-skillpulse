name: CD Workflow

on:
  workflow_run:
    workflows: ["CI Worflows"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            git clone https://github.com/jainikhs/github-actions-skillpulse.git
            cd ~/github-actions-skillpulse
            git pull origin main
            docker compose pull
            docker compose up -d